name: Build TroiaOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4.0.4
      with:
        packages: 'platform-tools'   # Явно указываем пакет, чтобы не устанавливать удаленный 'tools'

    - name: Install Build Tools
      run: |
        yes | sdkmanager --licenses > /dev/null  # Автоматически принимаем лицензии
        sdkmanager "build-tools;34.0.0" "platforms;android-34"

    - name: Build APK
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TroiaOS-APK
        path: TroiaOS.apk
